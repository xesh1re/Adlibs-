name: Compilar plugin

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Subir plugin
        uses: actions/upload-artifact@v4
        with:
          name: AdlibSakura-${{ matrix.os }}
          path: build/AdlibSakura_artefacts/Release/VST3/*
